name: CI/CD Lab 1

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ lcov cppcheck

    - name: Static Code Analysis (Cppcheck)
      run: |
        cppcheck --enable=all --error-exitcode=1 TicTacToe/ include/ src/ Polynomial/ || true

    - name: Build & Test TicTacToe
      run: |
        cd TicTacToe
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON ..
        cmake --build . --config Debug
        ctest --output-on-failure
        
        # Проверка покрытия TicTacToe
        lcov --capture --directory . --output-file coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch,empty
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors empty,unused
        lcov --list coverage.info

    - name: Build & Test Polynomial
      run: |
        cd Polynomial
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON ..
        cmake --build . --config Debug
        ctest --output-on-failure
        
        # Проверка покрытия Polynomial
        lcov --capture --directory . --output-file coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch,empty
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors empty,unused
        lcov --list coverage.info

    - name: Package Release Artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        mkdir -p release_artifacts
        cp TicTacToe/build/tictactoe_ui release_artifacts/tictactoe_app 2>/dev/null || true
        cp Polynomial/build/poly_ui release_artifacts/polynomial_app 2>/dev/null || true
        tar -czf lab1-binaries.tar.gz -C release_artifacts .

    - name: Publish Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: lab1-binaries.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}