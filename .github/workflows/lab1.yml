name: CI/CD Lab 1

on:
  push:
    branches:
      - main
      - master
      - feature/lab1
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            lcov \
            cppcheck \
            libgtest-dev

      - name: Проверить код через cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            lab1/TicTacToe/include/ \
            lab1/TicTacToe/src/ \
            lab1/Polynomial/include/ \
            lab1/Polynomial/src/

      # ---------------- TicTacToe ----------------

      - name: Настроить TicTacToe
        run: |
          rm -rf lab1/TicTacToe/build
          cmake -S lab1/TicTacToe -B lab1/TicTacToe/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Собрать TicTacToe
        run: |
          cmake --build lab1/TicTacToe/build --clean-first --parallel 2

      - name: Запустить тесты TicTacToe
        run: |
          ctest --test-dir lab1/TicTacToe/build --output-on-failure

      - name: Собрать покрытие TicTacToe
        run: |
          lcov \
            --capture \
            --directory lab1/TicTacToe/build \
            --output-file lab1/TicTacToe/build/coverage.info \
            --branch-coverage \
            --ignore-errors mismatch \
            --rc branch_coverage=1

          lcov \
            --remove lab1/TicTacToe/build/coverage.info \
            '/usr/*' \
            '*/tests/*' \
            '*/build/*' \
            --output-file lab1/TicTacToe/build/coverage_filtered.info \
            --ignore-errors mismatch \
            --rc branch_coverage=1

          lcov \
            --list lab1/TicTacToe/build/coverage_filtered.info \
            --rc branch_coverage=1

      # ---------------- Polynomial ----------------

      - name: Настроить Polynomial
        run: |
          rm -rf lab1/Polynomial/build
          cmake -S lab1/Polynomial -B lab1/Polynomial/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Собрать Polynomial
        run: |
          cmake --build lab1/Polynomial/build --clean-first --parallel 2

      - name: Запустить тесты Polynomial
        run: |
          ctest --test-dir lab1/Polynomial/build --output-on-failure

      - name: Собрать покрытие Polynomial
        run: |
          lcov \
            --capture \
            --directory lab1/Polynomial/build \
            --output-file lab1/Polynomial/build/coverage.info \
            --branch-coverage \
            --ignore-errors mismatch \
            --rc branch_coverage=1

          lcov \
            --remove lab1/Polynomial/build/coverage.info \
            '/usr/*' \
            '*/tests/*' \
            '*/build/*' \
            --output-file lab1/Polynomial/build/coverage_filtered.info \
            --ignore-errors mismatch \
            --rc branch_coverage=1

          lcov \
            --list lab1/Polynomial/build/coverage_filtered.info \
            --rc branch_coverage=1

      # ---------------- Artifacts ----------------

      - name: Сохранить отчёты покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lab1/TicTacToe/build/coverage_filtered.info
            lab1/Polynomial/build/coverage_filtered.info
          if-no-files-found: warn

  # ---------------- Release ----------------

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Создать архивы проектов
        run: |
          tar --exclude='*/build' \
              --exclude='*/build/*' \
              -czf TicTacToe.tar.gz lab1/TicTacToe

          tar --exclude='*/build' \
              --exclude='*/build/*' \
              -czf Polynomial.tar.gz lab1/Polynomial

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TicTacToe.tar.gz
            Polynomial.tar.gz