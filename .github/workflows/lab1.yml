name: CI/CD Lab 1

on:
  push:
    branches:
      - main
      - master
      - feature/lab1
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            lcov \
            cppcheck \
            libgtest-dev

      # ---------------- Static analysis ----------------

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            lab1/TicTacToe/include/ \
            lab1/TicTacToe/src/ \
            lab1/Polynomial/include/ \
            lab1/Polynomial/src/

      # ---------------- TicTacToe ----------------

      - name: Configure TicTacToe
        run: |
          rm -rf lab1/TicTacToe/build
          cmake \
            -S lab1/TicTacToe \
            -B lab1/TicTacToe/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build TicTacToe
        run: |
          cmake --build lab1/TicTacToe/build --parallel 2

      - name: Test TicTacToe
        run: |
          ctest \
            --test-dir lab1/TicTacToe/build \
            --output-on-failure

      - name: Capture TicTacToe coverage
        run: |
          lcov \
            --capture \
            --directory lab1/TicTacToe/build \
            --output-file lab1/TicTacToe/build/coverage.info \
            --branch-coverage \
            --ignore-errors mismatch \
            --rc branch_coverage=1

      - name: Filter TicTacToe coverage
        run: |
          lcov \
            --remove lab1/TicTacToe/build/coverage.info \
            '/usr/*' \
            '*/tests/*' \
            --output-file lab1/TicTacToe/build/coverage_filtered.info \
            --ignore-errors mismatch \
            --rc branch_coverage=1

          lcov \
            --list lab1/TicTacToe/build/coverage_filtered.info \
            --rc branch_coverage=1

      # ---------------- Polynomial ----------------

      - name: Configure Polynomial
        run: |
          rm -rf lab1/Polynomial/build
          cmake \
            -S lab1/Polynomial \
            -B lab1/Polynomial/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build Polynomial
        run: |
          cmake --build lab1/Polynomial/build --parallel 2

      - name: Test Polynomial
        run: |
          ctest \
            --test-dir lab1/Polynomial/build \
            --output-on-failure

      - name: Capture Polynomial coverage
        run: |
          lcov \
            --capture \
            --directory lab1/Polynomial/build \
            --output-file lab1/Polynomial/build/coverage.info \
            --branch-coverage \
            --ignore-errors mismatch \
            --rc branch_coverage=1

      - name: Filter Polynomial coverage
        run: |
          lcov \
            --remove lab1/Polynomial/build/coverage.info \
            '/usr/*' \
            '*/tests/*' \
            --output-file lab1/Polynomial/build/coverage_filtered.info \
            --ignore-errors mismatch \
            --rc branch_coverage=1

          lcov \
            --list lab1/Polynomial/build/coverage_filtered.info \
            --rc branch_coverage=1

      # ---------------- Upload coverage reports ----------------

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lab1/TicTacToe/build/coverage_filtered.info
            lab1/Polynomial/build/coverage_filtered.info
          if-no-files-found: warn

  # ---------------- Release ----------------

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package projects
        run: |
          tar \
            --exclude='build' \
            --exclude='*/build/*' \
            -czf TicTacToe.tar.gz \
            -C lab1 TicTacToe

          tar \
            --exclude='build' \
            --exclude='*/build/*' \
            -czf Polynomial.tar.gz \
            -C lab1 Polynomial

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TicTacToe.tar.gz
            Polynomial.tar.gz