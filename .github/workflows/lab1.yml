name: CI/CD Lab 1

on:
  push:
    branches:
      - "main"
      - "master"
      - "feature/lab1"
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov cppcheck libgtest-dev

      - name: Static Code Analysis (Cppcheck)
        run: |
          cppcheck --enable=all --error-exitcode=1 lab1/TicTacToe/include/ lab1/TicTacToe/src/ lab1/Polynomial/ || true

      - name: Build & Test TicTacToe
        run: |
          cd lab1/TicTacToe
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON ..
          cmake --build . --config Debug
          ctest --output-on-failure

          lcov --capture --directory . --output-file coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch,empty
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors empty,unused
          lcov --list coverage.info

      - name: Build & Test Polynomial
        run: |
          cd lab1/Polynomial
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON ..
          cmake --build . --config Debug
          ctest --output-on-failure

          lcov --capture --directory . --output-file coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch,empty
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors empty,unused
          lcov --list coverage.info

      - name: Package Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release_artifacts
          tar -czf release_artifacts/TicTacToe.tar.gz -C lab1/TicTacToe .
          tar -czf release_artifacts/Polynomial.tar.gz -C lab1/Polynomial .

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}