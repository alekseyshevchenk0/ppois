name: CI/CD Lab 1

on:
  push:
    branches:
      - main
      - master
      - feature/lab1
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            gcovr \
            cppcheck \
            libgtest-dev

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            lab1/TicTacToe/include/ \
            lab1/TicTacToe/src/ \
            lab1/Polynomial/include/ \
            lab1/Polynomial/src/

      - name: Configure TicTacToe
        run: |
          rm -rf lab1/TicTacToe/build
          cmake \
            -S lab1/TicTacToe \
            -B lab1/TicTacToe/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build TicTacToe
        run: |
          cmake --build lab1/TicTacToe/build --parallel 2

      - name: Test TicTacToe
        run: |
          ctest \
            --test-dir lab1/TicTacToe/build \
            --output-on-failure

      - name: Generate TicTacToe coverage report
        run: |
          gcovr \
            --root lab1/TicTacToe \
            --object-directory lab1/TicTacToe/build \
            --filter 'lab1/TicTacToe/src/' \
            --exclude 'lab1/TicTacToe/src/main.cpp' \
            --html-details \
            --output lab1/TicTacToe/build/coverage.html \
            --fail-under-line 91

      - name: Configure Polynomial
        run: |
          rm -rf lab1/Polynomial/build
          cmake \
            -S lab1/Polynomial \
            -B lab1/Polynomial/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build Polynomial
        run: |
          cmake --build lab1/Polynomial/build --parallel 2

      - name: Test Polynomial
        run: |
          ctest \
            --test-dir lab1/Polynomial/build \
            --output-on-failure

      - name: Generate Polynomial coverage report
        run: |
          gcovr \
            --root lab1/Polynomial \
            --object-directory lab1/Polynomial/build \
            --filter 'lab1/Polynomial/src/' \
            --exclude 'lab1/Polynomial/src/main.cpp' \
            --html-details \
            --output lab1/Polynomial/build/coverage.html \
            --fail-under-line 91

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lab1/TicTacToe/build/coverage.html
            lab1/TicTacToe/build/coverage/
            lab1/Polynomial/build/coverage.html
            lab1/Polynomial/build/coverage/
          if-no-files-found: warn

  
  
  release:
    name: Build and Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ doxygen graphviz

      - name: Build TicTacToe
        run: |
          cmake -S lab1/TicTacToe \
                -B lab1/TicTacToe/build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=OFF \
                -DENABLE_COVERAGE=OFF \
                -DBUILD_DOCS=OFF

          cmake --build lab1/TicTacToe/build-release --parallel 2

      - name: Build Polynomial
        run: |
          cmake -S lab1/Polynomial \
                -B lab1/Polynomial/build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=OFF \
                -DENABLE_COVERAGE=OFF \
                -DBUILD_DOCS=OFF

          cmake --build lab1/Polynomial/build-release --parallel 2

      - name: Package executables
        run: |
          mkdir -p release

          cp lab1/TicTacToe/build-release/tictactoe_ui \
             release/tictactoe

          cp lab1/Polynomial/build-release/poly_ui \
             release/polynomial

          chmod +x release/tictactoe release/polynomial

          tar -czf TicTacToe-linux-x86_64.tar.gz \
              -C release tictactoe

          tar -czf Polynomial-linux-x86_64.tar.gz \
              -C release polynomial

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TicTacToe-linux-x86_64.tar.gz
            Polynomial-linux-x86_64.tar.gz

