name: CI/CD Lab 1

on:
  push:
    branches:
      - main
      - master
      - feature/lab1
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            lcov \
            cppcheck \
            libgtest-dev

      - name: Static Code Analysis (Cppcheck)
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            lab1/TicTacToe/include \
            lab1/TicTacToe/src \
            lab1/Polynomial/include \
            lab1/Polynomial/src

      - name: Build & Test TicTacToe
        run: |
          rm -rf lab1/TicTacToe/build

          cmake -S lab1/TicTacToe -B lab1/TicTacToe/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

          cmake --build lab1/TicTacToe/build --parallel

          ctest \
            --test-dir lab1/TicTacToe/build \
            --output-on-failure

          lcov \
            --capture \
            --directory lab1/TicTacToe/build \
            --output-file lab1/TicTacToe/build/coverage.info \
            --rc lcov_branch_coverage=1

          lcov \
            --remove lab1/TicTacToe/build/coverage.info \
            '/usr/*' \
            '*/tests/*' \
            '*/_deps/*' \
            --output-file lab1/TicTacToe/build/coverage_filtered.info \
            --rc lcov_branch_coverage=1

          lcov \
            --list lab1/TicTacToe/build/coverage_filtered.info \
            --rc lcov_branch_coverage=1

      - name: Build & Test Polynomial
        run: |
          rm -rf lab1/Polynomial/build

          cmake -S lab1/Polynomial -B lab1/Polynomial/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

          cmake --build lab1/Polynomial/build --parallel

          ctest \
            --test-dir lab1/Polynomial/build \
            --output-on-failure

          lcov \
            --capture \
            --directory lab1/Polynomial/build \
            --output-file lab1/Polynomial/build/coverage.info \
            --rc lcov_branch_coverage=1

          lcov \
            --remove lab1/Polynomial/build/coverage.info \
            '/usr/*' \
            '*/tests/*' \
            '*/_deps/*' \
            --output-file lab1/Polynomial/build/coverage_filtered.info \
            --rc lcov_branch_coverage=1

          lcov \
            --list lab1/Polynomial/build/coverage_filtered.info \
            --rc lcov_branch_coverage=1

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lab1/TicTacToe/build/coverage_filtered.info
            lab1/Polynomial/build/coverage_filtered.info
          if-no-files-found: warn
          retention-days: 14

      - name: Package Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release_artifacts

          tar -czf release_artifacts/TicTacToe.tar.gz \
            --exclude=build \
            -C lab1/TicTacToe .

          tar -czf release_artifacts/Polynomial.tar.gz \
            --exclude=build \
            -C lab1/Polynomial .

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
